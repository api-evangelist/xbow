aid: xbow
name: Xbow
description: >-
  XBOW is an autonomous offensive security platform that uses AI to perform
  penetration testing with real exploit validation — it identifies
  vulnerabilities, chains them into attack paths, and proves exploitability
  before findings reach security teams. The XBOW API (public preview) exposes
  the full platform workflow: register assets, launch and manage assessments,
  fetch validated findings and reports, upload source-code resources for
  gray-box testing, and subscribe webhooks with Ed25519-signed deliveries.
  XBOW has ranked #1 on the HackerOne and Microsoft MSRC leaderboards and is
  used by 150+ security teams.
