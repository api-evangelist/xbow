                      type: string
                  minItems: 1
                  type: array
                targetUrl:
                  format: uri
                  type: string
              required:
              - apiVersion
              - events
              - targetUrl
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                example:
                  apiVersion: next
                  createdAt: '2025-01-01T00:00:00Z'
                  events:
