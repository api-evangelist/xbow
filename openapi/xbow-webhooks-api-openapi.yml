  assessment.changed:
    post:
      description: Sent when an `assessment.changed` event occurs.
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              properties:
                assessment:
                  properties:
                    assetId:
