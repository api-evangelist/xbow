                        type: string
                      - enum:
                        - finding.changed
                        type: string
                      - enum:
                        - challenge.changed
                        type: string
                      - enum:
                        - '*'
                        type: string
                    minItems: 1
                    type: array
                  id:
                    type: string
                  targetUrl:
                    format: uri
                    type: string
                  updatedAt:
                    format: date-time
                    type: string
                required:
                - apiVersion
                - createdAt
                - events
                - id
                - targetUrl
                - updatedAt
                type: object
          description: Default Response
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: A constant for machines
                    enum:
                    - FST_ERR_VALIDATION
                    type: string
                  error:
                    description: A human readable string for the constant
                    enum:
                    - Bad Request
                    type: string
                  message:
