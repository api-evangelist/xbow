paths:
  /api/v1/organizations/{organizationId}/resources:
    get:
      description: List resources in an organization.
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      - in: query
        name: after
        required: false
        schema:
          type: string
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
      - description: API version to use for this request
        in: header
        name: X-XBOW-API-Version
        required: true
        schema:
          enum:
          - '2026-07-01'
          example: '2026-07-01'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      properties:
                        createdAt:
                          format: date-time
                          type: string
                        fileName:
                          type: string
                        id:
                          type: string
                        name:
                          type: string
                        sha256:
                          anyOf:
                          - type: string
                          - type: 'null'
                        sizeBytes:
                          anyOf:
                          - type: number
                          - type: 'null'
                        status:
                          enum:
                          - deleted
                          - failed
                          - initiated
                          - processing
                          - ready
                          type: string
                        statusMessage:
                          anyOf:
                          - type: string
                          - type: 'null'
                        type:
                          enum:
                          - documentation
                          - report
                          - source
                          type: string
                        updatedAt:
                          format: date-time
                          type: string
                      required:
                      - createdAt
                      - fileName
                      - id
                      - name
                      - sha256
                      - sizeBytes
                      - status
                      - statusMessage
                      - type
                      - updatedAt
                      type: object
                    type: array
                  nextCursor:
                    type: string
                required:
                - items
                type: object
          description: Default Response
      security:
      - Authorization: []
      summary: List resources
      tags:
      - Resources
    post:
      description: Create a new resource in an organization. For example, source code to be used in an assessment.
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
      - description: API version to use for this request
        in: header
        name: X-XBOW-API-Version
        required: true
        schema:
          enum:
          - '2026-07-01'
          example: '2026-07-01'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              example:
                fileName: source.tar.gz
                name: Source code for upcoming release
                type: source
              properties:
                fileName:
                  type: string
                name:
                  type: string
                type:
                  enum:
                  - documentation
                  - report
                  - source
                  type: string
              required:
              - fileName
              - name
              - type
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  createdAt:
                    format: date-time
                    type: string
                  fileName:
                    type: string
                  id:
                    type: string
                  name:
                    type: string
                  organizationId:
                    type: string
                  type:
                    enum:
                    - documentation
                    - report
                    - source
                    type: string
                  updatedAt:
                    format: date-time
                    type: string
                required:
                - createdAt
                - fileName
                - id
                - name
                - organizationId
                - type
                - updatedAt
                type: object
          description: Default Response
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: A constant for machines
                    enum:
                    - FST_ERR_VALIDATION
                    type: string
                  error:
                    description: A human readable string for the constant
                    enum:
                    - Bad Request
                    type: string
                  message:
                    description: A human readable message
                    type: string
                  requestId:
                    description: A unique identifier for the request
                    type: string
                required:
                - code
                - error
                - message
                - requestId
                type: object
          description: Default Response
      security:
      - Authorization: []
      summary: Create resource
      tags:
      - Resources
