  /api/v1/resources/{resourceId}/parts:
    post:
      description: Get presigned upload URLs for specific parts of a multipart upload.
      parameters:
      - in: path
        name: resourceId
        required: true
        schema:
          type: string
      - description: API version to use for this request
        in: header
        name: X-XBOW-API-Version
        required: true
        schema:
          enum:
          - '2026-07-01'
          example: '2026-07-01'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              example:
                parts:
                - 1
                - 2
                - 3
              properties:
                parts:
                  items:
                    maximum: 9007199254740991
                    minimum: 1
                    type: integer
                  type: array
              required:
              - parts
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                example:
                  parts:
                  - expiresAt: '2026-05-11T08:14:23.976Z'
                    partNumber: 1
                    url: https://presignedurl.amazonaws.com/upload?partNumber=1&uploadId=abc123
                  storageProtocol: S3
                properties:
                  parts:
                    items:
                      properties:
                        expiresAt:
                          format: date-time
                          type: string
                        partNumber:
                          maximum: 9007199254740991
                          minimum: -9007199254740991
                          type: integer
                        url:
                          type: string
                      required:
                      - expiresAt
                      - partNumber
                      - url
                      type: object
                    type: array
                  storageProtocol:
                    enum:
                    - S3
                    type: string
                required:
                - parts
                - storageProtocol
                type: object
          description: Default Response
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: A constant for machines
                    enum:
                    - FST_ERR_VALIDATION
                    type: string
                  error:
