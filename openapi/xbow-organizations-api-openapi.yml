  /api/v1/organizations/{organizationId}/keys:
    post:
      description: 'Creates a new API key for an organization in an integration.


        Requires an _integration_ API key.'
      parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
      - description: API version to use for this request
        in: header
        name: X-XBOW-API-Version
        required: true
        schema:
          enum:
          - '2026-07-01'
          example: '2026-07-01'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              example:
                expiresInMinutes: 30
                name: Example Key
              properties:
                expiresInMinutes:
                  default: 60
                  description: Number of minutes until the key expires. If not specified, defaults to 1 hour. Maximum 1440 minutes (24 hours).
                  exclusiveMinimum: 0
                  maximum: 1440
                  type: integer
                name:
                  type: string
              required:
              - name
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                example:
                  createdAt: '2025-01-01T00:00:00Z'
                  expiresAt: '2026-01-01T00:00:00Z'
                  id: 123e4567-e89b-12d3-a456-426614174000
                  key: xbt_0010-123e4567-e89b-12d3-a456-426614174000-AbCdEfGhIjKlMnOpQrStUvWxYz
                  name: Example Key
                  updatedAt: '2025-01-01T00:00:00Z'
                properties:
                  createdAt:
                    format: date-time
                    type: string
                  expiresAt:
                    anyOf:
                    - format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      type: string
                    - type: 'null'
                  id:
                    type: string
                  key:
                    type: string
                  name:
                    type: string
                  updatedAt:
                    format: date-time
                    type: string
                required:
                - createdAt
                - expiresAt
                - id
                - key
                - name
                - updatedAt
                type: object
          description: Default Response
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: A constant for machines
                    enum:
                    - FST_ERR_VALIDATION
                    type: string
                  error:
                    description: A human readable string for the constant
                    enum:
                    - Bad Request
                    type: string
                  message:
                    description: A human readable message
                    type: string
                  requestId:
                    description: A unique identifier for the request
                    type: string
                required:
                - code
                - error
                - message
                - requestId
                type: object
          description: Default Response
        '403':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: A constant for machines
                    enum:
                    - ERR_FORBIDDEN
                    type: string
                  error:
                    description: A human readable string for the constant
                    enum:
                    - Forbidden
                    type: string
                  message:
                    description: A human readable message
                    type: string
                  requestId:
                    description: A unique identifier for the request
                    type: string
                required:
                - code
                - error
                - message
                - requestId
                type: object
          description: Default Response
      security:
      - Authorization: []
      summary: Create organization key
      tags:
      - Organizations
      operationId: postApiV1OrganizationsByOrganizationIdKeys
      x-operation-id-source: derived
