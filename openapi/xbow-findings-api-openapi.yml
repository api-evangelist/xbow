  /api/v1/findings/{findingId}/verify-fix:
    post:
      description: Request verification that a finding has been mitigated. This will trigger a targeted assessment specifically to verify that the vulnerability has been mitigated. Once XBOW verifies that the finding has been fixed, it will be marked as such.
      parameters:
      - in: path
        name: findingId
        required: true
        schema:
          type: string
      - description: API version to use for this request
        in: header
        name: X-XBOW-API-Version
